services:
  control-plane:
    build:
      context: .
      args:
        # The updater tags the currently working service image locally so no
        # blocked GitHub Release download is required during normal upgrades.
        SING_BOX_SOURCE_IMAGE: ${CONTROL_PLANE_SING_BOX_SOURCE_IMAGE:-ghcr.io/sagernet/sing-box:v1.13.19@sha256:78ca1bc9f3b563b0944fd6b1126522ee631e7b44d540b91fc435ba7062ef08b2}
        CONTROL_PLANE_BUILD_COMMIT: ${CONTROL_PLANE_BUILD_COMMIT:-unknown}
        APT_MIRROR: ${CONTROL_PLANE_BUILD_APT_MIRROR:-https://mirrors.cloud.tencent.com/debian}
        APT_SECURITY_MIRROR: ${CONTROL_PLANE_BUILD_APT_SECURITY_MIRROR:-https://mirrors.cloud.tencent.com/debian-security}
        PIP_INDEX_URL: ${CONTROL_PLANE_BUILD_PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}
        PIP_TRUSTED_HOST: ${CONTROL_PLANE_BUILD_PIP_TRUSTED_HOST:-}
        PIP_DEFAULT_TIMEOUT: ${CONTROL_PLANE_BUILD_PIP_TIMEOUT:-120}
        PIP_RETRIES: ${CONTROL_PLANE_BUILD_PIP_RETRIES:-8}
    container_name: qianniu-api-control-plane
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${CONTROL_PLANE_BIND_PORT:-18081}:8080"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
