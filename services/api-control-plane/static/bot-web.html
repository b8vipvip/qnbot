<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>千牛 AI Bot</title>
  <link rel="stylesheet" href="/static/bot-web-v2.css?v=2">
</head>
<body>
<div id="loginView" class="login-shell hidden">
  <form id="loginForm" class="login-card">
    <div class="brand">Q</div>
    <h1>千牛 AI Bot</h1>
    <p>使用对应 Windows Bot 的客户端令牌登录。</p>
    <label>Bot 客户端令牌
      <input id="tokenInput" type="password" autocomplete="current-password" placeholder="qnb_..." required>
    </label>
    <label class="remember"><input id="rememberToken" type="checkbox">在本设备记住令牌</label>
    <button class="primary wide" type="submit">登录 Bot</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="top-title"><strong id="clientName">Bot</strong><span id="connectionText">正在连接</span></div>
    <div class="top-actions"><span id="onlineBadge" class="pill gray">离线</span><button id="logoutBtn" class="text-button">退出</button></div>
  </header>

  <main>
    <section id="page-status" class="page active">
      <div class="hero-card"><div><span class="eyebrow">实时运行状态</span><h2 id="heroStatus">等待 Windows Bot 上线</h2><p id="heroDetail">客户端会自动同步状态。</p></div><div id="heroDot" class="hero-dot"></div></div>
      <div id="metrics" class="metric-grid"></div>
      <section class="panel"><div class="panel-head"><h3>登录中的客服账号</h3><span id="sellerCount" class="pill gray">0</span></div><div id="sellerList" class="chip-list"></div></section>
      <section class="panel"><div class="panel-head"><h3>最近远程操作</h3><button id="refreshStatusBtn" class="text-button">刷新</button></div><div id="commandList" class="command-list"></div></section>
    </section>

    <section id="page-messages" class="page messages-page">
      <div id="chatShell" class="chat-shell">
        <aside id="conversationPane" class="conversation-pane">
          <div class="conversation-head"><strong>Bot 问答会话</strong><span id="conversationCount">0</span></div>
          <div class="search-row"><input id="conversationSearch" placeholder="搜索买家昵称或 Bot 问答"><button id="refreshConversationsBtn">刷新</button></div>
          <div id="conversationList" class="conversation-list"><div class="empty">暂无 Bot 问答记录</div></div>
        </aside>
        <section id="chatDetailPane" class="chat-detail hidden-mobile">
          <div class="chat-detail-head">
            <button id="backConversationBtn" class="back-button">‹</button>
            <div><strong id="chatBuyerName">请选择买家</strong><small id="chatSellerName">仅显示买家问题与 Bot 自动回答</small></div>
            <button id="refreshChatBtn" class="text-button">刷新</button>
          </div>
          <button id="loadOlderBtn" class="load-older hidden">加载更早问答</button>
          <div id="chatMessageList" class="message-list"><div class="empty">从左侧选择一个 Bot 问答会话</div></div>
          <form id="replyForm" class="reply-box hidden">
            <textarea id="replyText" maxlength="2000" rows="2" placeholder="通过 Windows Bot 发送人工回复"></textarea>
            <button id="sendReplyBtn" class="primary" type="submit">发送</button>
          </form>
        </section>
      </div>
    </section>

    <section id="page-knowledge" class="page">
      <div class="knowledge-head">
        <div><h2>云同步知识库</h2><p id="knowledgeSyncHint">等待 Windows Bot 同步</p></div>
        <button id="addKnowledgeBtn" class="primary">新增知识</button>
      </div>
      <div class="knowledge-toolbar"><input id="knowledgeSearch" placeholder="搜索问题、答案或关键词"><select id="knowledgeCategory"><option value="">全部分类</option></select><button id="refreshKnowledgeBtn">刷新</button></div>
      <div id="knowledgeMeta" class="knowledge-meta"></div>
      <div id="knowledgeList" class="knowledge-list"><div class="empty">暂无云端知识</div></div>
    </section>

    <section id="page-settings" class="page">
      <section class="panel settings-panel">
        <h3>远程控制</h3>
        <label class="switch-row"><span><strong>启用 Bot</strong><small id="botEnabledHint">控制当前店铺的 Bot 总开关；关闭后 Bot 不再参与消息处理。</small></span><input id="botEnabled" type="checkbox"></label>
        <label class="switch-row"><span><strong>智能自动回复</strong><small>关闭后不再进入智能回复流程，但仍保留 Bot 其他功能。</small></span><input id="autoReplyEnabled" type="checkbox"></label>
        <label class="switch-row"><span><strong>同步 Bot 问答到 Web</strong><small>Web 端只展示触发 Bot 回复的买家问题与 Bot 自动答案，不展示普通人工客服聊天。</small></span><input id="messageSyncEnabled" type="checkbox"></label>
        <label class="switch-row"><span><strong>允许手机人工回复</strong><small>允许从手机页面向买家发送文本。</small></span><input id="manualReplyEnabled" type="checkbox"></label>
        <label class="field-row"><span>同步间隔</span><select id="syncInterval"><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="30">30 秒</option></select></label>
        <label class="field-row"><span>消息保留</span><select id="retentionDays"><option value="1">1 天</option><option value="3">3 天</option><option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option></select></label>
        <button id="saveSettingsBtn" class="primary wide" type="button">保存并下发到 Windows Bot</button><div id="settingsHint" class="hint"></div>
      </section>
      <section class="panel"><h3>当前客户端信息</h3><dl id="clientInfo" class="info-list"></dl></section>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-page="status" class="active"><span>●</span>状态</button>
    <button data-page="messages"><span>▤</span>问答</button>
    <button data-page="knowledge"><span>◆</span>知识库</button>
    <button data-page="settings"><span>⚙</span>设置</button>
  </nav>
</div>

<!-- Backward-compatible marker retained for older packaging tests; the active list is chatMessageList. -->
<div id="messageList" class="hidden" aria-hidden="true"></div>

<div id="messageActionSheet" class="sheet-backdrop hidden"><div class="action-sheet"><div id="actionMessagePreview" class="sheet-preview"></div><button id="copyMessageAction">复制消息</button><button id="saveKnowledgeAction">保存为知识问答</button><button id="searchKnowledgeAction">搜索相关知识</button><button id="cancelMessageAction" class="cancel">取消</button></div></div>

<dialog id="knowledgeDialog" class="knowledge-dialog">
  <form method="dialog" id="knowledgeForm">
    <input id="knowledgeId" type="hidden">
    <div class="dialog-head"><h3 id="knowledgeDialogTitle">新增知识</h3><button value="cancel" class="close-button">×</button></div>
    <label>分类<input id="knowledgeEditCategory" maxlength="200" value="通用"></label>
    <label>问题<textarea id="knowledgeEditTitle" rows="3" maxlength="1000" required></textarea></label>
    <label>答案<textarea id="knowledgeEditAnswer" rows="7" maxlength="10000" required></textarea></label>
    <label>关键词<textarea id="knowledgeEditKeywords" rows="2" maxlength="2000"></textarea></label>
    <label class="remember"><input id="knowledgeEditEnabled" type="checkbox" checked>启用这条知识</label>
    <div class="dialog-actions"><button id="deleteKnowledgeBtn" type="button" class="danger hidden">删除</button><span></span><button value="cancel" class="secondary">取消</button><button id="saveKnowledgeBtn" type="button" class="primary">保存</button></div>
  </form>
</dialog>

<div id="toast" class="toast hidden"></div>
<script src="/static/bot-web-v2.js?v=3"></script>
<script src="/static/bot-web-bot-enabled.js?v=2"></script>
</body>
</html>
