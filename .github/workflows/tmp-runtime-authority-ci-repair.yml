name: Temporary runtime authority CI repair
on:
  push:
    branches:
      - fix/runtime-authority-20260929
    paths:
      - scripts/tmp_fix_runtime_authority_ci.py
      - .github/workflows/tmp-runtime-authority-ci-repair.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-authority-20260929
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/tmp_fix_runtime_authority_ci.py
      - name: Commit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/Bot/ChromeNs/CommerceContextService.cs tests/test_1330_commerce_reply_agent_static.py tests/test_1581_runtime_authority_regressions_static.py
          git commit -m "fix: align runtime authority code and regression contracts"
          git push origin HEAD:fix/runtime-authority-20260929
