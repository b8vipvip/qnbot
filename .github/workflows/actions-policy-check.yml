name: Actions Policy Check
on:
  pull_request:
    paths: ['.github/workflows/**', '.github/scripts/**']
  push:
    branches: [master]
    paths: ['.github/workflows/**', '.github/scripts/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actions-policy-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Validate changed workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/wf; else base="${{ github.event.pull_request.base.sha || github.event.before }}"; if [[ -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]]; then git diff --name-only "$base" HEAD -- '.github/workflows/*.yml' '.github/workflows/*.yaml' | while read -r f; do [[ -f "$f" ]] && echo "$f"; done > /tmp/wf; else git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/wf; fi; fi
          [[ ! -s /tmp/wf ]] || python .github/scripts/validate_actions_strategy.py $(cat /tmp/wf)
