name: Repository Housekeeping
on:
  push:
    branches: [master]
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repository-housekeeping-${{ github.repository }}
  cancel-in-progress: true
jobs:
  prune-stale-branches:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete every non-default branch older than 7 days
        shell: bash
        run: |
          set -Eeuo pipefail
          default="${{ github.event.repository.default_branch }}"
          cutoff="$(date -u -d '7 days ago' +%s)"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          deleted=0; kept=0
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == HEAD || "$branch" == "$default" ]] && continue
            tip_epoch="$(git log -1 --format=%ct "$ref")"
            tip_date="$(git log -1 --format=%cI "$ref")"
            if (( tip_epoch < cutoff )); then
              echo "DELETE stale branch: $branch (tip=$tip_date)"
              if git push origin --delete "$branch"; then deleted=$((deleted+1)); else echo "::warning::Unable to delete $branch"; kept=$((kept+1)); fi
            else
              echo "KEEP recent branch: $branch (tip=$tip_date)"
              kept=$((kept+1))
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin)
          echo "deleted=$deleted kept=$kept"
