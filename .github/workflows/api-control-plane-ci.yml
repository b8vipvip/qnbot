name: API control plane CI

on:
  push:
    branches:
      - feat/api-control-plane
      - agent/reply-dedup-knowledge-navigation
    paths:
      - services/api-control-plane/**
      - scripts/update-api-control-plane.sh
      - scripts/update-bot.ps1
      - tests/**
      - .github/workflows/api-control-plane-ci.yml
  pull_request:
    paths:
      - services/api-control-plane/**
      - scripts/update-api-control-plane.sh
      - scripts/update-bot.ps1
      - tests/**
      - .github/workflows/api-control-plane-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-control-plane-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast-gate:
    name: Fast Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate server updater shell syntax
        run: bash -n scripts/update-api-control-plane.sh
      - name: Install fast-test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run repository static tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short tests 2>&1 | tee repository-static.log
      - name: Upload fast-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-static-${{ github.sha }}
          path: repository-static.log
          if-no-files-found: warn
          retention-days: 7
      - name: Compile API control-plane Python
        run: python -m compileall -q services/api-control-plane
      - name: Check browser JavaScript syntax
        run: |
          node --check services/api-control-plane/static/app.js
          node --check services/api-control-plane/static/bot-web-auto-reply-rules.js
          node --check services/api-control-plane/static/bot-web-bot-enabled.js
          node --check services/api-control-plane/static/message-traces.js
          node --check services/api-control-plane/static/version-update.js
          node --check services/api-control-plane/static/console-startup-guard.js
          node --check services/api-control-plane/static/ocr-settings.js

  windows-static:
    name: Windows Static Gate
    needs: fast-gate
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Windows updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/update-bot.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  full-gate:
    name: Full Gate / Build Package
    needs: [fast-gate, windows-static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/api-control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/api-control-plane/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run control plane tests
        env:
          DATA_DIR: ${{ runner.temp }}/qianniu-api-control-plane-test-data
          DATABASE_PATH: ${{ runner.temp }}/qianniu-api-control-plane-test-data/api-control-plane.db
          APP_SECRET: ci-control-plane-tests-secret-at-least-32-bytes
        run: |
          set -o pipefail
          mkdir -p "$DATA_DIR"
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-control-plane-pytest-${{ github.sha }}
          path: services/api-control-plane/pytest.log
          if-no-files-found: warn
          retention-days: 7
      - name: Build Ubuntu container
        run: docker build -t qianniu-api-control-plane:${{ github.sha }} .
      - name: Smoke test Ubuntu container startup and OCR engine
        run: |
          set -euo pipefail
          FERNET_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          docker run -d --name qianniu-api-control-plane-smoke \
            -e APP_SECRET='ci-smoke-test-secret-at-least-32-bytes' \
            -e ADMIN_USERNAME='admin' \
            -e ADMIN_PASSWORD='ci-smoke-password' \
            -e API_KEY_ENCRYPTION_KEY="$FERNET_KEY" \
            -p 127.0.0.1:18081:8080 \
            qianniu-api-control-plane:${{ github.sha }}
          cleanup() {
            docker logs qianniu-api-control-plane-smoke || true
            docker rm -f qianniu-api-control-plane-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18081/healthz >/tmp/control-plane-health.json; then
              cat /tmp/control-plane-health.json
              curl --max-time 2 -fsS http://127.0.0.1:18081/api/public/v1/bot-update/latest >/tmp/bot-update-latest.json || true
              docker exec qianniu-api-control-plane-smoke python -c "import io; from PIL import Image; import runtime_ocr; b=io.BytesIO(); Image.new('RGB',(32,32),'white').save(b,format='PNG'); r=runtime_ocr._run_ocr(b.getvalue()); assert r.get('ok') is True; assert r.get('engine') == 'RapidOCR/ONNXRuntime'; print('OCR engine smoke ok, elapsedMs=' + str(r.get('elapsedMs')))"
              docker exec qianniu-api-control-plane-smoke python -c "import runtime_ocr_priority as p; assert p._DEFAULT_PRIORITY in {p.OCR_FIRST,p.AI_FIRST}; print('OCR vision priority smoke ok: ' + p._DEFAULT_PRIORITY)"
              exit 0
            fi
            sleep 2
          done
          echo 'control plane container did not become healthy in time' >&2
          exit 1
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config >/dev/null
          docker compose -f docker-compose.bt.yml config >/dev/null
      - name: Clean generated caches
        run: |
          rm -f .env pytest.log
          rm -rf .test-data
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
      - name: Upload Ubuntu deployment package
        uses: actions/upload-artifact@v7
        with:
          name: qianniu-api-control-plane-ubuntu-${{ github.sha }}
          path: |
            services/api-control-plane/app.py
            services/api-control-plane/bootstrap.py
            services/api-control-plane/chat2api_runtime_guard.py
            services/api-control-plane/deep_test_guard.py
            services/api-control-plane/bot_update_cache.py
            services/api-control-plane/bot_update_prefetch.py
            services/api-control-plane/bot_update_progress.py
            services/api-control-plane/bot_update_push.py
            services/api-control-plane/github_vless_proxy.py
            services/api-control-plane/bot_web_auto_reply_rules.py
            services/api-control-plane/bot_web_bot_enabled.py
            services/api-control-plane/scheduled_deep_test_retry.py
            services/api-control-plane/runtime_embedding_guard.py
            services/api-control-plane/runtime_ocr.py
            services/api-control-plane/runtime_ocr_priority.py
            services/api-control-plane/runtime_routing_guard.py
            services/api-control-plane/runtime_streaming_guard.py
            services/api-control-plane/version_update_admin.py
            services/api-control-plane/wecom_bridge.py
            services/api-control-plane/wecom_crypto.py
            services/api-control-plane/wecom_settings.py
            services/api-control-plane/static/**
            services/api-control-plane/tests/**
            services/api-control-plane/requirements.txt
            services/api-control-plane/Dockerfile
            services/api-control-plane/docker-compose.yml
            services/api-control-plane/docker-compose.bt.yml
            services/api-control-plane/Caddyfile
            services/api-control-plane/.env.example
            services/api-control-plane/.dockerignore
            services/api-control-plane/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
