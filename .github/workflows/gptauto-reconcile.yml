name: GPTAuto Reconcile
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Stable GPTAuto task ID
        required: true
      pr_number:
        description: Merged PR number
        required: true
      merge_sha:
        description: Merge commit SHA
        required: true
      release_required:
        description: Whether the product release workflow must succeed
        required: true
        default: 'false'
  push:
    branches: [master]
    paths:
      - '.github/workflows/gptauto-reconcile.yml'
permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write
concurrency:
  group: gptauto-reconcile-${{ inputs.task_id || github.run_id }}
  cancel-in-progress: true
jobs:
  recover-active-leases:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-dispatch active merged completion leases with current reconciler
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp)"
          gh api --paginate "repos/$REPOSITORY/pulls?state=closed&sort=updated&direction=desc&per_page=100" \
            --jq '.[] | select(.merged_at != null) | [.number, .merge_commit_sha] | @tsv' \
            | head -n 40 > "$tmp"

          dispatched=0
          while IFS=$'\t' read -r pr_number merge_sha; do
            [[ -n "$pr_number" && -n "$merge_sha" ]] || continue
            comments="$(gh api "repos/$REPOSITORY/issues/$pr_number/comments?per_page=100" 2>/dev/null || echo '[]')"
            active_body="$(jq -r '[.[] | select((.body // "") | contains("gptauto-completion-lease:")) | select((.body // "") | contains("Completion Lease is ACTIVE"))] | sort_by(.updated_at) | reverse | .[0].body // empty' <<<"$comments")"
            [[ -n "$active_body" ]] || continue
            task_id="$(sed -n 's/.*gptauto-completion-lease:\(GA-[0-9a-fA-F]*\).*/\1/p' <<<"$active_body" | head -n1)"
            [[ -n "$task_id" ]] || continue

            files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" --jq '.[].filename' 2>/dev/null || true)"
            release_required=false
            if grep -Eq '^(src/|tools/qn_discovery_lab/)' <<<"$files"; then
              release_required=true
            fi

            echo "Recovering active lease task=$task_id pr=$pr_number merge=$merge_sha release_required=$release_required"
            gh workflow run gptauto-reconcile.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
              -f task_id="$task_id" -f pr_number="$pr_number" -f merge_sha="$merge_sha" \
              -f release_required="$release_required"
            dispatched=$((dispatched + 1))
          done < "$tmp"
          echo "Recovery dispatch count: $dispatched"

  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for terminal post-merge gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
        shell: bash
        run: |
          set -Eeuo pipefail
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"

            ci_runs="$(jq '[.workflow_runs[] | select(.name == "CI" or .name == "Windows x64 release build" or .name == "API control plane CI" or .name == "GPTAuto Protocol Check")] | group_by(.name) | map(max_by(.created_at))' <<<"$runs")"
            ci_count="$(jq 'length' <<<"$ci_runs")"
            ci_failures="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$ci_runs")"
            ci_pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$ci_runs")"
            ci_detail="$(jq -r 'map(.name + "=" + (.status // "missing") + "/" + (.conclusion // "")) | join("; ")' <<<"$ci_runs")"

            if [[ "$ci_failures" -gt 0 ]]; then
              jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "::error::Trusted CI gate failed: " + .name + "=" + (.conclusion // "")' <<<"$ci_runs"
              exit 1
            fi

            ci_status="missing"
            ci_conclusion=""
            if [[ "$ci_count" -gt 0 && "$ci_pending" -gt 0 ]]; then
              ci_status="in_progress"
            elif [[ "$ci_count" -gt 0 ]]; then
              ci_status="completed"
              ci_conclusion="success"
            fi

            release_status="completed"
            release_conclusion="success"
            release_run_id=""
            release_detail="not-required"
            if [[ "$RELEASE_REQUIRED" == "true" ]]; then
              release_runs="$(jq '[.workflow_runs[] | select(.name == "Release" or .name == "Publish Bot auto-update release")] | group_by(.name) | map(max_by(.created_at))' <<<"$runs")"
              release_count="$(jq 'length' <<<"$release_runs")"
              release_failures="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"$release_runs")"
              release_pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"$release_runs")"
              release_detail="$(jq -r 'map(.name + "=" + (.status // "missing") + "/" + (.conclusion // "")) | join("; ")' <<<"$release_runs")"
              if [[ "$release_failures" -gt 0 ]]; then
                jq -r '.[] | select(.status == "completed" and .conclusion != "success") | "::error::Trusted release gate failed: " + .name + "=" + (.conclusion // "")' <<<"$release_runs"
                exit 1
              fi
              if [[ "$release_count" -eq 0 ]]; then
                release_status="missing"
                release_conclusion=""
              elif [[ "$release_pending" -gt 0 ]]; then
                release_status="in_progress"
                release_conclusion=""
              else
                release_status="completed"
                release_conclusion="success"
                release_run_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' <<<"$release_runs")"
              fi
            fi

            echo "task=$TASK_ID ci=$ci_status/$ci_conclusion [$ci_detail] release=$release_status/$release_conclusion [$release_detail]"
            if [[ "$ci_status" == "completed" && "$ci_conclusion" == "success" \
                  && "$release_status" == "completed" && "$release_conclusion" == "success" ]]; then
              main_ci_run_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' <<<"$ci_runs")"
              all_ci_run_ids="$(jq -r 'sort_by(.created_at) | reverse | map(.id | tostring) | join(",")' <<<"$ci_runs")"
              [[ -n "$main_ci_run_id" ]] || { echo "::error::No trusted CI run ID available"; exit 1; }
              echo "main-ci-run-id=$main_ci_run_id" >> "$GITHUB_OUTPUT"
              echo "all-ci-run-ids=$all_ci_run_ids" >> "$GITHUB_OUTPUT"
              echo "release-run-id=$release_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for post-merge completion gates"
          exit 1
      - name: Capture terminal DONE evidence directly
        id: terminal
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_ID: ${{ inputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MAIN_CI_RUN_ID: ${{ steps.gates.outputs.main-ci-run-id }}
          ALL_CI_RUN_IDS: ${{ steps.gates.outputs.all-ci-run-ids }}
          RELEASE_RUN_ID: ${{ steps.gates.outputs.release-run-id }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          pr_title="$(jq -r '.title // ""' <<<"$pr_json")"
          pr_body="$(jq -r '.body // ""' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          merged="$(jq -r 'if .merged_at then "true" else "false" end' <<<"$pr_json")"
          actual_merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
          [[ "$merged" == "true" ]] || { echo "::error::PR is no longer recorded as merged"; exit 1; }
          [[ "$actual_merge_sha" == "$MERGE_SHA" ]] || { echo "::error::Merge SHA mismatch during terminal capture"; exit 1; }

          pr_runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$pr_head_sha&per_page=100" 2>/dev/null || echo '{"workflow_runs":[]}')"
          pr_ci_runs="$(jq '[.workflow_runs[] | select(.name == "CI" or .name == "Windows x64 release build" or .name == "API control plane CI" or .name == "GPTAuto Protocol Check")] | group_by(.name) | map(max_by(.created_at))' <<<"$pr_runs")"
          pr_ci_count="$(jq 'length' <<<"$pr_ci_runs")"
          pr_ci_bad="$(jq '[.[] | select(.status != "completed" or .conclusion != "success")] | length' <<<"$pr_ci_runs")"
          [[ "$pr_ci_count" -gt 0 ]] || { echo "::error::No trusted PR CI gate found for $pr_head_sha"; exit 1; }
          [[ "$pr_ci_bad" -eq 0 ]] || {
            jq -r '.[] | select(.status != "completed" or .conclusion != "success") | "::error::PR CI evidence is not successful: " + .name + "=" + (.status // "") + "/" + (.conclusion // "")' <<<"$pr_ci_runs"
            exit 1
          }
          pr_ci_run_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' <<<"$pr_ci_runs")"

          previous_artifact_id="$(gh api "repos/$REPOSITORY/actions/artifacts?name=gptauto-$TASK_ID&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
          if [[ -n "$previous_artifact_id" ]]; then
            mkdir -p ".gptauto/logs/$TASK_ID"
            gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact_id/zip" > /tmp/gptauto-previous.zip
            unzip -qo /tmp/gptauto-previous.zip -d ".gptauto/logs/$TASK_ID"
          fi

          release_conclusion=""
          [[ "$RELEASE_REQUIRED" == "true" ]] && release_conclusion="success"
          PYTHONPATH=.github python -m gptauto.observer capture \
            --event "reconcile" --repo "$REPOSITORY" --default-branch "$DEFAULT_BRANCH" \
            --branch "$DEFAULT_BRANCH" --head-sha "$MERGE_SHA" --pr-number "$PR_NUMBER" \
            --pr-title "$pr_title" --pr-body "$pr_body" --pr-state "closed" --pr-merged "true" \
            --merge-sha "$MERGE_SHA" --run-id "$RUN_ID" --actor "$ACTOR" \
            --pr-ci-conclusion "success" --pr-ci-run-id "$pr_ci_run_id" \
            --main-ci-conclusion "success" --main-ci-run-id "$MAIN_CI_RUN_ID" \
            --release-conclusion "$release_conclusion" --release-run-id "$RELEASE_RUN_ID" \
            --current-pr-head-sha "$pr_head_sha" --release-required-override "$RELEASE_REQUIRED" \
            --provenance "reconciler" > terminal-result.json
          cat terminal-result.json
          captured_task_id="$(python -c 'import json;print(json.load(open("terminal-result.json"))["task_id"])')"
          captured_state="$(python -c 'import json;print(json.load(open("terminal-result.json"))["state"])')"
          captured_release_required="$(python -c 'import json;print(str(json.load(open("terminal-result.json"))["release_required"]).lower())')"
          captured_provenance="$(python -c 'import json;print(json.load(open("terminal-result.json"))["provenance"])')"
          [[ "$captured_task_id" == "$TASK_ID" ]] || { echo "::error::Terminal capture changed TASK_ID"; exit 1; }
          [[ "$captured_state" == "DONE" ]] || { echo "::error::Terminal capture did not reach DONE: $captured_state"; exit 1; }
          [[ "$captured_release_required" == "$RELEASE_REQUIRED" ]] || { echo "::error::Terminal capture changed release intent"; exit 1; }
          [[ "$captured_provenance" == "reconciler" ]] || { echo "::error::Terminal capture provenance is not reconciler"; exit 1; }
          echo "task-id=$captured_task_id" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-gptauto-log
        with:
          task-id: ${{ steps.terminal.outputs.task-id }}
          retention-days: '30'
      - name: Publish terminal foreground receipt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="<!-- gptauto-completion-lease:$TASK_ID -->"
          body="$marker
          GPTAuto Completion Lease is RELEASED for task $TASK_ID.

          Terminal state: DONE
          Merge SHA: $MERGE_SHA
          Foreground completion is now permitted because Reconcile produced terminal DONE evidence."
          comments="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')"
          comment_id="$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))] | .[0].id // empty' <<<"$comments")"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
      - name: Terminal receipt summary
        env:
          TASK_ID: ${{ inputs.task_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MAIN_CI_RUN_ID: ${{ steps.gates.outputs.main-ci-run-id }}
          ALL_CI_RUN_IDS: ${{ steps.gates.outputs.all-ci-run-ids }}
          RELEASE_RUN_ID: ${{ steps.gates.outputs.release-run-id }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
        shell: bash
        run: |
          {
            echo "## GPTAuto terminal reconciliation"
            echo "- Task: $TASK_ID"
            echo "- State: DONE"
            echo "- Merge: $MERGE_SHA"
            echo "- Primary CI run: $MAIN_CI_RUN_ID"
            echo "- All trusted CI runs: $ALL_CI_RUN_IDS"
            echo "- Release required: $RELEASE_REQUIRED"
            echo "- Release run: ${RELEASE_RUN_ID:-not-required}"
            echo "- Terminal evidence provenance: reconciler"
            echo "- Completion is path-aware: every trusted CI gate that actually ran for this SHA must be successful; unrelated path-filtered workflows are not fabricated as missing gates."
            echo "- Terminal release intent is pinned to the Executor/Reconcile lease input, not recomputed from mutable PR text."
            echo "- Terminal evidence was captured and uploaded by Reconcile itself; no follow-up Observer run is required."
          } >> "$GITHUB_STEP_SUMMARY"
