name: GPTAuto Reconcile
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Stable GPTAuto task ID
        required: true
      pr_number:
        description: Merged PR number
        required: true
      merge_sha:
        description: Merge commit SHA
        required: true
      release_required:
        description: Whether Release must succeed
        required: true
        default: 'false'
permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write
concurrency:
  group: gptauto-reconcile-${{ inputs.task_id }}
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and dispatch canonical post-merge validation gate
        id: validation-plan
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # Task Protocol v2: Reconcile is the explicit post-merge scheduler.
          # A merge performed with GITHUB_TOKEN does not necessarily emit another
          # workflow-triggering push, so waiting for a spontaneous push CI is not
          # a valid lifecycle transition.
          catalog="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/workflows?per_page=100" | jq -c '[.[].workflows[]]')"
          configured="$(gh variable get GPTAUTO_POST_MERGE_WORKFLOW --repo "$REPOSITORY" 2>/dev/null || true)"
          if [[ -n "$configured" ]]; then
            primary_path="$(jq -r --arg wanted "$configured" '[.[] | select((.name == $wanted or .path == $wanted) and ((.state // "") | ascii_downcase | startswith("disabled") | not))][0].path // empty' <<<"$catalog")"
            [[ -n "$primary_path" ]] || { echo "::error::Configured GPTAUTO_POST_MERGE_WORKFLOW '$configured' is missing or disabled"; exit 1; }
          else
            primary_path="$(jq -r '[.[] | select(((.name == "CI") or (.name == "Build and Test")) and ((.state // "") | ascii_downcase | startswith("disabled") | not))] | (map(select(.name == "CI"))[0].path // .[0].path // empty)' <<<"$catalog")"
            [[ -n "$primary_path" ]] || { echo "::error::No canonical product validation workflow named CI or Build and Test is enabled. Configure GPTAUTO_POST_MERGE_WORKFLOW."; exit 1; }
          fi
          primary="$(jq -r --arg path "$primary_path" '.[] | select(.path == $path) | .name' <<<"$catalog" | head -n1)"
          [[ -n "$primary" ]] || { echo "::error::Unable to resolve product validation workflow name for $primary_path"; exit 1; }

          current_main="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
          [[ "$current_main" == "$MERGE_SHA" ]] || {
            echo "::error::Default branch moved to $current_main before post-merge validation for $MERGE_SHA; refusing to validate a different commit"
            exit 1
          }

          printf '%s\n' "$primary" > /tmp/gptauto-required-workflows.txt
          echo "required-workflows=$primary" >> "$GITHUB_OUTPUT"
          echo "workflow-path=$primary_path" >> "$GITHUB_OUTPUT"
          echo "Canonical post-merge validation workflow: $primary ($primary_path)"

          # Reuse exact-SHA success evidence if it already exists. Otherwise
          # dispatch exactly one workflow_dispatch run and bind later validation
          # to the returned run generation rather than polling for registration.
          runs_before="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
          existing_success="$(jq -r --arg workflow "$primary" '[.workflow_runs[] | select(.name == $workflow and .status == "completed" and .conclusion == "success")] | sort_by(.created_at, .id) | reverse | .[0].id // empty' <<<"$runs_before")"
          if [[ -n "$existing_success" ]]; then
            echo "validation-run-id=$existing_success" >> "$GITHUB_OUTPUT"
            echo "Reusing exact-SHA post-merge validation run $existing_success."
          else
            baseline="$(jq -r --arg workflow "$primary" '[.workflow_runs[] | select(.name == $workflow) | .id] | max // 0' <<<"$runs_before")"
            gh workflow view "$primary_path" --repo "$REPOSITORY" --yaml > /tmp/gptauto-product-workflow.yml
            grep -Eq '^[[:space:]]*workflow_dispatch:' /tmp/gptauto-product-workflow.yml || {
              echo "::error::Canonical post-merge workflow $primary_path has no workflow_dispatch trigger. Add workflow_dispatch or configure GPTAUTO_POST_MERGE_WORKFLOW to a dispatchable product workflow."
              exit 1
            }
            gh workflow run "$primary_path" --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
            echo "Dispatched canonical post-merge validation for merge $MERGE_SHA."

            registration_deadline=$((SECONDS + 90))
            validation_run_id=""
            while (( SECONDS < registration_deadline )); do
              runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
              validation_run_id="$(jq -r --arg workflow "$primary" --argjson baseline "$baseline" '[.workflow_runs[] | select(.name == $workflow and .event == "workflow_dispatch" and .id > $baseline)] | sort_by(.created_at, .id) | reverse | .[0].id // empty' <<<"$runs")"
              [[ -n "$validation_run_id" ]] && break
              sleep 3
            done
            [[ -n "$validation_run_id" ]] || { echo "::error::Dispatched $primary_path but no exact-SHA workflow_dispatch run registered for $MERGE_SHA"; exit 1; }
            echo "validation-run-id=$validation_run_id" >> "$GITHUB_OUTPUT"
            echo "Registered canonical post-merge validation run $validation_run_id."
          fi

          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            release_path="$(jq -r '[.[] | select(.name == "Release" and ((.state // "") | ascii_downcase | startswith("disabled") | not))][0].path // empty' <<<"$catalog")"
            [[ -n "$release_path" ]] || { echo "::error::Release is required but no enabled Release workflow exists"; exit 1; }
          fi

      - name: Wait for terminal post-merge validation gates
        id: gates
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          required_run_id="${{ steps.validation-plan.outputs.validation-run-id }}"
          [[ -n "$required_run_id" ]] || { echo "::error::Canonical validation run id is missing"; exit 1; }
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
            all_ready=true
            while IFS= read -r workflow; do
              [[ -n "$workflow" ]] || continue
              row="$(jq -c --arg workflow "$workflow" --argjson required_run_id "$required_run_id" '[.workflow_runs[] | select(.name == $workflow and .id == $required_run_id)] | .[0] // {}' <<<"$runs")"
              status="$(jq -r '.status // "missing"' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              run_id="$(jq -r '.id // ""' <<<"$row")"
              echo "task=$TASK_ID workflow=$workflow run=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" && "$conclusion" != "success" ]]; then
                echo "::error::Required post-merge workflow $workflow finished with $conclusion (run $run_id)"
                exit 1
              fi
              if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
                all_ready=false
              fi
            done < /tmp/gptauto-required-workflows.txt

            if [[ "$all_ready" == "true" ]]; then
              primary="$(head -n 1 /tmp/gptauto-required-workflows.txt)"
              ci_run_id="$required_run_id"
              [[ -n "$ci_run_id" ]] || { echo "::error::Required product validation success evidence is missing"; exit 1; }
              echo "main-ci-run-id=$ci_run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for post-merge validation gates"
          exit 1

      - name: Require published release evidence
        id: release-proof
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$RELEASE_REQUIRED" != "true" ]]; then
            echo "release-published=false" >> "$GITHUB_OUTPUT"
            echo "release-run-id=" >> "$GITHUB_OUTPUT"
            echo "release-id=" >> "$GITHUB_OUTPUT"
            echo "release-tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          find_release_for_merge() {
            local rid tag resolved
            while IFS=$'\t' read -r rid tag; do
              [[ -n "$rid" && -n "$tag" ]] || continue
              resolved="$(gh api "repos/$REPOSITORY/commits/$tag" --jq '.sha' 2>/dev/null || true)"
              if [[ "$resolved" == "$MERGE_SHA" ]]; then
                printf '%s\t%s\n' "$rid" "$tag"
                return 0
              fi
            done < <(gh api "repos/$REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .published_at != null) | [.id, .tag_name] | @tsv')
            return 1
          }

          proof="$(find_release_for_merge || true)"
          release_run_id=""
          if [[ -z "$proof" ]]; then
            catalog="$(gh api --paginate --slurp "repos/$REPOSITORY/actions/workflows?per_page=100" | jq -c '[.[].workflows[]]')"
            release_path="$(jq -r '[.[] | select(.name == "Release" and ((.state // "") | ascii_downcase | startswith("disabled") | not))][0].path // empty' <<<"$catalog")"
            [[ -n "$release_path" ]] || { echo "::error::Release is required but no enabled Release workflow exists"; exit 1; }

            runs_before="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
            baseline="$(jq '[.workflow_runs[] | select(.name == "Release") | .id] | max // 0' <<<"$runs_before")"
            gh workflow view "$release_path" --repo "$REPOSITORY" --yaml > /tmp/gptauto-release-workflow.yml

            if grep -Eq '^[[:space:]]+source_sha:' /tmp/gptauto-release-workflow.yml; then
              gh workflow run "$release_path" --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" -f source_sha="$MERGE_SHA"
            else
              current_main="$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq '.sha')"
              [[ "$current_main" == "$MERGE_SHA" ]] || {
                echo "::error::Release workflow has no source_sha input and $DEFAULT_BRANCH moved to $current_main; refusing to publish the wrong commit"
                exit 1
              }
              gh workflow run "$release_path" --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH"
            fi
            echo "Dispatched Release only after all post-merge validation gates passed."

            deadline=$((SECONDS + 900))
            while (( SECONDS < deadline )); do
              runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
              row="$(jq -c --argjson baseline "$baseline" '[.workflow_runs[] | select(.name == "Release" and .id > $baseline)] | sort_by(.created_at, .id) | reverse | .[0] // {}' <<<"$runs")"
              status="$(jq -r '.status // "missing"' <<<"$row")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$row")"
              release_run_id="$(jq -r '.id // ""' <<<"$row")"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "::error::Release workflow failed with $conclusion (run $release_run_id)"
                  exit 1
                }
                proof="$(find_release_for_merge || true)"
                [[ -n "$proof" ]] || {
                  echo "::error::Release workflow succeeded without published GitHub Release evidence targeting merge $MERGE_SHA (run $release_run_id)"
                  exit 1
                }
                break
              fi
              sleep 5
            done
            [[ -n "$proof" ]] || { echo "::error::Timed out waiting for published release evidence"; exit 1; }
          else
            runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
            release_run_id="$(jq -r '[.workflow_runs[] | select(.name == "Release" and .conclusion == "success")] | sort_by(.created_at, .id) | reverse | .[0].id // empty' <<<"$runs")"
          fi

          release_id="${proof%%$'\t'*}"
          release_tag="${proof#*$'\t'}"
          [[ -n "$release_id" && -n "$release_tag" ]] || { echo "::error::Published release proof is malformed"; exit 1; }
          echo "release-published=true" >> "$GITHUB_OUTPUT"
          echo "release-run-id=$release_run_id" >> "$GITHUB_OUTPUT"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Published release evidence: id=$release_id tag=$release_tag merge=$MERGE_SHA"

      - name: Publish post-merge recovery handoff
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          RUN_ID: ${{ github.run_id }}
          VALIDATION_PLAN_OUTCOME: ${{ steps.validation-plan.outcome }}
          VALIDATION_GATES_OUTCOME: ${{ steps.gates.outcome }}
          RELEASE_PROOF_OUTCOME: ${{ steps.release-proof.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_marker="<!-- gptauto-post-merge-recovery:$TASK_ID:$MERGE_SHA -->"
          lease_marker="<!-- gptauto-completion-lease:$TASK_ID -->"
          run_url="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"
          recovery_body="$recovery_marker
          GPTAuto POST_MERGE_RECOVERY_REQUIRED for task $TASK_ID.

          Merge SHA: $MERGE_SHA
          Reconcile run: $RUN_ID
          Validation plan: $VALIDATION_PLAN_OUTCOME
          Validation gates: $VALIDATION_GATES_OUTCOME
          Release proof: $RELEASE_PROOF_OUTCOME

          This is non-terminal recovery evidence. The merged engineering task is NOT complete. Inspect the Reconcile run, repair the failed post-merge validation/release path, and rerun Reconcile for this same task/merge until published terminal evidence exists. Do not manufacture a release tag or mark the task complete merely because a Release workflow is green.

          Run: $run_url"
          lease_body="$lease_marker
          GPTAuto Completion Lease is ACTIVE for task $TASK_ID (decision: reconcile_recovery).

          This engineering task is NOT complete. Post-merge reconciliation failed for merge $MERGE_SHA in run $RUN_ID. Continue recovery until Reconcile produces terminal DONE evidence."

          comments="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')"
          recovery_id="$(jq -r --arg marker "$recovery_marker" '[.[] | select(.body | contains($marker))] | .[0].id // empty' <<<"$comments")"
          if [[ -n "$recovery_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$recovery_id" -f body="$recovery_body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$recovery_body" >/dev/null
          fi

          lease_id="$(jq -r --arg marker "$lease_marker" '[.[] | select(.body | contains($marker))] | .[0].id // empty' <<<"$comments")"
          if [[ -n "$lease_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$lease_id" -f body="$lease_body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$lease_body" >/dev/null
          fi

          {
            echo "## GPTAuto post-merge recovery handoff"
            echo "- Task: $TASK_ID"
            echo "- Merge: $MERGE_SHA"
            echo "- Reconcile run: $RUN_ID"
            echo "- Validation plan: $VALIDATION_PLAN_OUTCOME"
            echo "- Validation gates: $VALIDATION_GATES_OUTCOME"
            echo "- Release proof: $RELEASE_PROOF_OUTCOME"
            echo "- Completion Lease remains ACTIVE as reconcile_recovery."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture terminal DONE evidence directly
        id: terminal
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_ID: ${{ inputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MAIN_CI_RUN_ID: ${{ steps.gates.outputs.main-ci-run-id }}
          RELEASE_RUN_ID: ${{ steps.release-proof.outputs.release-run-id }}
          RELEASE_ID: ${{ steps.release-proof.outputs.release-id }}
          RELEASE_TAG: ${{ steps.release-proof.outputs.release-tag }}
          RELEASE_PUBLISHED: ${{ steps.release-proof.outputs.release-published }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          pr_title="$(jq -r '.title // ""' <<<"$pr_json")"
          pr_body="$(jq -r '.body // ""' <<<"$pr_json")"
          pr_head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          merged="$(jq -r 'if .merged_at then "true" else "false" end' <<<"$pr_json")"
          actual_merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")"
          [[ "$merged" == "true" ]] || { echo "::error::PR is no longer recorded as merged"; exit 1; }
          [[ "$actual_merge_sha" == "$MERGE_SHA" ]] || { echo "::error::Merge SHA mismatch during terminal capture"; exit 1; }

          pr_ci_run_id="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$pr_head_sha&status=success&per_page=50" --jq '[.workflow_runs[] | select(.name == "CI" and .conclusion == "success")][0].id // empty' 2>/dev/null || true)"
          previous_artifact_id="$(gh api "repos/$REPOSITORY/actions/artifacts?name=gptauto-$TASK_ID&per_page=10" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
          if [[ -n "$previous_artifact_id" ]]; then
            mkdir -p ".gptauto/logs/$TASK_ID"
            gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact_id/zip" > /tmp/gptauto-previous.zip
            unzip -qo /tmp/gptauto-previous.zip -d ".gptauto/logs/$TASK_ID"
          fi

          release_conclusion=""
          if [[ "$RELEASE_REQUIRED" == "true" ]]; then
            [[ "$RELEASE_PUBLISHED" == "true" ]] || { echo "::error::Release-required task has no published release proof"; exit 1; }
            release_conclusion="success"
          fi
          PYTHONPATH=.github python -m gptauto.observer capture             --event "reconcile" --repo "$REPOSITORY" --default-branch "$DEFAULT_BRANCH"             --branch "$DEFAULT_BRANCH" --head-sha "$MERGE_SHA" --pr-number "$PR_NUMBER"             --pr-title "$pr_title" --pr-body "$pr_body" --pr-state "closed" --pr-merged "true"             --merge-sha "$MERGE_SHA" --run-id "$RUN_ID" --actor "$ACTOR"             --pr-ci-conclusion "success" --pr-ci-run-id "$pr_ci_run_id"             --main-ci-conclusion "success" --main-ci-run-id "$MAIN_CI_RUN_ID"             --release-conclusion "$release_conclusion" --release-run-id "$RELEASE_RUN_ID"             --release-tag "$RELEASE_TAG" --release-published "$RELEASE_PUBLISHED" --release-id "$RELEASE_ID"             --current-pr-head-sha "$pr_head_sha" --release-required-override "$RELEASE_REQUIRED"             --provenance "reconciler" > terminal-result.json
          cat terminal-result.json
          captured_task_id="$(python -c 'import json;print(json.load(open("terminal-result.json"))["task_id"])')"
          captured_state="$(python -c 'import json;print(json.load(open("terminal-result.json"))["state"])')"
          captured_release_required="$(python -c 'import json;print(str(json.load(open("terminal-result.json"))["release_required"]).lower())')"
          captured_provenance="$(python -c 'import json;print(json.load(open("terminal-result.json"))["provenance"])')"
          [[ "$captured_task_id" == "$TASK_ID" ]] || { echo "::error::Terminal capture changed TASK_ID"; exit 1; }
          [[ "$captured_state" == "DONE" ]] || { echo "::error::Terminal capture did not reach DONE: $captured_state"; exit 1; }
          [[ "$captured_release_required" == "$RELEASE_REQUIRED" ]] || { echo "::error::Terminal capture changed release intent"; exit 1; }
          [[ "$captured_provenance" == "reconciler" ]] || { echo "::error::Terminal capture provenance is not reconciler"; exit 1; }
          echo "task-id=$captured_task_id" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-gptauto-log
        with:
          task-id: ${{ steps.terminal.outputs.task-id }}
          retention-days: '30'
      - name: Publish terminal foreground receipt
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ inputs.task_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="<!-- gptauto-completion-lease:$TASK_ID -->"
          body="$marker
          GPTAuto Completion Lease is RELEASED for task $TASK_ID.

          Terminal state: DONE
          Merge SHA: $MERGE_SHA
          Foreground completion is now permitted because Reconcile produced terminal DONE evidence."
          comments="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')"
          comment_id="$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))] | .[0].id // empty' <<<"$comments")"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
      - name: Terminal receipt summary
        env:
          TASK_ID: ${{ inputs.task_id }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MAIN_CI_RUN_ID: ${{ steps.gates.outputs.main-ci-run-id }}
          RELEASE_RUN_ID: ${{ steps.release-proof.outputs.release-run-id }}
          RELEASE_ID: ${{ steps.release-proof.outputs.release-id }}
          RELEASE_TAG: ${{ steps.release-proof.outputs.release-tag }}
          RELEASE_PUBLISHED: ${{ steps.release-proof.outputs.release-published }}
          RELEASE_REQUIRED: ${{ inputs.release_required }}
        shell: bash
        run: |
          {
            echo "## GPTAuto terminal reconciliation"
            echo "- Task: $TASK_ID"
            echo "- State: DONE"
            echo "- Merge: $MERGE_SHA"
            echo "- Main CI run: $MAIN_CI_RUN_ID"
            echo "- Release required: $RELEASE_REQUIRED"
            echo "- Release run: ${RELEASE_RUN_ID:-not-required}"
            echo "- Release published: ${RELEASE_PUBLISHED:-false}"
            echo "- Release ID: ${RELEASE_ID:-not-required}"
            echo "- Release tag: ${RELEASE_TAG:-not-required}"
            echo "- Terminal evidence provenance: reconciler"
            echo "- Terminal release intent is pinned to the Executor/Reconcile lease input, not recomputed from mutable PR text."
            echo "- Terminal evidence was captured and uploaded by Reconcile itself; no follow-up Observer run is required."
          } >> "$GITHUB_STEP_SUMMARY"
