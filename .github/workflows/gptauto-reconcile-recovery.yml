name: GPTAuto Reconcile Recovery
on:
  workflow_run:
    workflows: [API control plane CI, Windows x64 release build]
    types: [completed]
permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: gptauto-reconcile-recovery-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Recover the pinned historical merged task only with exact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
          TASK_ID: GA-ddf0aa319783
          PR_NUMBER: "434"
          MERGE_SHA: 483b07f03eeeeef5e9339b286d2c179378489ccc
          RELEASE_REQUIRED: "false"
        shell: bash
        run: |
          set -Eeuo pipefail

          latest_master="$(gh api "repos/$REPOSITORY/commits/master" --jq '.sha')"
          if [[ "$latest_master" != "$CURRENT_SHA" ]]; then
            echo "::notice::Skipping stale recovery event sha=$CURRENT_SHA latest_master=$latest_master."
            exit 0
          fi

          current_runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$CURRENT_SHA&per_page=100")"
          current_api="$(jq -c --arg sha "$CURRENT_SHA" '[.workflow_runs[] | select(.name == "API control plane CI" and .head_branch == "master" and .head_sha == $sha)] | sort_by(.created_at,.id) | last // {}' <<<"$current_runs")"
          current_windows="$(jq -c --arg sha "$CURRENT_SHA" '[.workflow_runs[] | select(.name == "Windows x64 release build" and .head_branch == "master" and .head_sha == $sha)] | sort_by(.created_at,.id) | last // {}' <<<"$current_runs")"
          for gate in "$current_api" "$current_windows"; do
            status="$(jq -r '.status // "missing"' <<<"$gate")"
            conclusion="$(jq -r '.conclusion // "missing"' <<<"$gate")"
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "::notice::Recovery waits for current exact-SHA API and Windows gates; status=$status conclusion=$conclusion."
              exit 0
            fi
          done

          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          actual_merge_sha="$(jq -r '.merge_commit_sha // ""' <<<"$pr")"
          merged_at="$(jq -r '.merged_at // ""' <<<"$pr")"
          if [[ -z "$merged_at" || "$actual_merge_sha" != "$MERGE_SHA" ]]; then
            echo "::notice::Pinned PR #$PR_NUMBER no longer matches the expected merged SHA; refusing recovery."
            exit 0
          fi

          comments="$(gh api --paginate "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" | jq -s 'add // []')"
          completion_marker="<!-- gptauto-completion-lease:$TASK_ID -->"
          completion_body="$(jq -r --arg marker "$completion_marker" '[.[] | select((.body // "") | contains($marker))] | sort_by(.updated_at,.id) | last | .body // ""' <<<"$comments")"
          if grep -Fq "Completion Lease is RELEASED" <<<"$completion_body" \
            && grep -Fq "Terminal state: DONE" <<<"$completion_body" \
            && grep -Fq "Merge SHA: $MERGE_SHA" <<<"$completion_body"; then
            echo "Historical task $TASK_ID already has the exact terminal DONE receipt."
            exit 0
          fi
          if ! grep -Fq "Completion Lease is ACTIVE" <<<"$completion_body"; then
            echo "::notice::No matching ACTIVE Completion Lease found for task=$TASK_ID; refusing recovery."
            exit 0
          fi

          pr_head_sha="$(jq -r '.head.sha // ""' <<<"$pr")"
          pr_runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$pr_head_sha&per_page=100")"
          pr_gate_rows="$(jq -c --arg head "$pr_head_sha" '[.workflow_runs[] | select(.head_sha == $head and .event == "pull_request" and (.name == "API control plane CI" or .name == "CI" or .name == "Windows x64 release build"))] | group_by(.name) | map(sort_by(.created_at,.id) | last)' <<<"$pr_runs")"
          for required_name in "API control plane CI" "Windows x64 release build"; do
            row="$(jq -c --arg name "$required_name" '[.[] | select(.name == $name)] | last // {}' <<<"$pr_gate_rows")"
            status="$(jq -r '.status // "missing"' <<<"$row")"
            conclusion="$(jq -r '.conclusion // "missing"' <<<"$row")"
            if [[ "$status" != "completed" || "$conclusion" != "success" ]]; then
              echo "::notice::Historical PR gate $required_name is not successful on exact head $pr_head_sha."
              exit 0
            fi
          done
          invalid_pr_gates="$(jq -c '[.[] | select(.conclusion != "skipped") | select(.status != "completed" or .conclusion != "success")]' <<<"$pr_gate_rows")"
          if [[ "$invalid_pr_gates" != "[]" ]]; then
            echo "::notice::Historical PR has a non-successful exact-head validation run: $invalid_pr_gates"
            exit 0
          fi

          main_runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$MERGE_SHA&per_page=100")"
          main_ci="$(jq -c --arg sha "$MERGE_SHA" '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.created_at,.id) | last // {}' <<<"$main_runs")"
          if [[ "$(jq -r '.id // empty' <<<"$main_ci")" == "" ]]; then
            echo "::notice::No successful exact-merge-SHA post-merge CI evidence; refusing recovery."
            exit 0
          fi

          reconcile_runs="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/gptauto-reconcile.yml/runs?per_page=100" | jq -s 'map(.workflow_runs) | add // []')"
          active_run="$(jq -r --arg task "$TASK_ID" '[.[] | select((.display_title // "") | contains($task)) | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested")] | sort_by(.created_at,.id) | last | .id // empty' <<<"$reconcile_runs")"
          if [[ -n "$active_run" ]]; then
            echo "Reconcile run $active_run is already active for task=$TASK_ID; no duplicate dispatch."
            exit 0
          fi

          gh workflow run gptauto-reconcile.yml --repo "$REPOSITORY" --ref master \
            -f task_id="$TASK_ID" -f pr_number="$PR_NUMBER" -f merge_sha="$MERGE_SHA" \
            -f release_required="$RELEASE_REQUIRED"
          {
            echo "## GPTAuto historical Reconcile recovery"
            echo "- Task: `$TASK_ID`"
            echo "- PR: #$PR_NUMBER"
            echo "- Merge SHA: `$MERGE_SHA`"
            echo "- Current source SHA: `$CURRENT_SHA`"
            echo "- Exact-head PR API/Windows gates and exact-merge CI: passed"
            echo "- Release required: `$RELEASE_REQUIRED`"
            echo "- Dispatch: submitted; the Completion Lease remains ACTIVE until Reconcile publishes terminal DONE."
          } >> "$GITHUB_STEP_SUMMARY"
