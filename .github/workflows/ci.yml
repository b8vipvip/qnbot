name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/gptauto/**'
      - '.github/actions/upload-gptauto-log/**'
      - '.github/workflows/gptauto-*.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/api-control-plane-ci.yml'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

concurrency:
  group: canonical-product-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-control-plane:
    name: API control plane
    uses: ./.github/workflows/api-control-plane-ci.yml

  windows-bot:
    name: Windows Bot
    uses: ./.github/workflows/windows-build.yml
