name: Apply recoverable inject v11 patch

on:
  push:
    branches:
      - fix/recoverable-inject-v11-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply recoverable inject v11 migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recoverable-inject-v11-20260909
          fetch-depth: 0
      - name: Patch injection lifecycle
        shell: python {0}
        run: |
          from pathlib import Path

          inject_path = Path('src/Bin/inject.js')
          s = inject_path.read_text(encoding='utf-8-sig')
          old_marker = '20260906-zh-cn-ws-retire-v10'
          new_marker = '20260909-ws-recoverable-standby-v11'
          assert old_marker in s
          s = s.replace('window.__qnbotInjectVersion = "' + old_marker + '";', 'window.__qnbotInjectVersion = "' + new_marker + '";')
          s = s.replace('  var websocketRetired = false;', '  var websocketStandbyUntil = 0;')
          s = s.replace('    if (websocketRetired) return;\n    var payload = JSON.stringify({ type: type, response: response || "" });', '    var payload = JSON.stringify({ type: type, response: response || "" });')
          old_reconnect = '''  function scheduleReconnect() {
            if (websocketRetired || reconnectTimer) return;
            reconnectTimer = setTimeout(function () {
              reconnectTimer = null;
              setupWebSocket();
            }, 3000);
          }

          function setupWebSocket() {
            if (websocketRetired) return;
            var old = window.chatWebsocket;'''
          new_reconnect = '''  function scheduleReconnect(delayMs) {
            if (reconnectTimer) return;
            var delay = Math.max(1000, Number(delayMs) || 3000);
            if (websocketStandbyUntil > Date.now()) {
              delay = Math.max(delay, websocketStandbyUntil - Date.now());
            }
            reconnectTimer = setTimeout(function () {
              reconnectTimer = null;
              setupWebSocket();
            }, delay);
          }

          function setupWebSocket() {
            if (websocketStandbyUntil > Date.now()) {
              scheduleReconnect(websocketStandbyUntil - Date.now());
              return;
            }
            var old = window.chatWebsocket;'''
          assert old_reconnect in s
          s = s.replace(old_reconnect, new_reconnect)
          s = s.replace('        window.chatWebsocket = socket;\n        log("websocket connected");', '        window.chatWebsocket = socket;\n        websocketStandbyUntil = 0;\n        log("websocket connected", "recoverable-standby-v11");')
          old_retire = '''          if (param.method === "retireDuplicate") {
            websocketRetired = true;
            pending.length = 0;
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
            log("websocket retired by Bot", param.reason || "duplicate");
            try { socket.close(1000, "qnbot-duplicate-retired"); } catch (e) {}
            return;
          }'''
          new_retire = '''          if (param.method === "retireDuplicate") {
            // Compatibility with older Bot builds: duplicate pages enter a short standby
            // lease instead of becoming permanently retired. A later Bot restart or lease
            // expiry must always allow this still-live WebView to reconnect and re-elect.
            websocketStandbyUntil = Date.now() + 15000;
            pending.length = 0;
            if (reconnectTimer) {
              clearTimeout(reconnectTimer);
              reconnectTimer = null;
            }
            log("websocket standby requested by Bot", param.reason || "duplicate");
            try { socket.close(1000, "qnbot-duplicate-standby"); } catch (e) {}
            scheduleReconnect(15000);
            return;
          }'''
          assert old_retire in s
          s = s.replace(old_retire, new_retire)
          s = s.replace('        if (!websocketRetired) scheduleReconnect();', '        scheduleReconnect();')
          s = s.replace('      duplicateRetire: true,', '      duplicateRetire: false,\n      recoverableStandby: true,')
          assert 'websocketRetired' not in s
          assert new_marker in s
          inject_path.write_text(s, encoding='utf-8-sig')

          qn_path = Path('src/Bot/Common/QNInject.cs')
          q = qn_path.read_text(encoding='utf-8-sig')
          assert 'private const string injectVersionMarker = "' + old_marker + '";' in q
          q = q.replace('private const string injectVersionMarker = "' + old_marker + '";', 'private const string injectVersionMarker = "' + new_marker + '";')
          old_running = '''                if (IsWorkbenchRunning())
                {
                    if (MessageBox.Show("检测到千牛正在运行。需要先退出千牛后注入插件，是否现在关闭千牛并继续？", "提示", MessageBoxButton.YesNo)
                        == MessageBoxResult.No)
                    {
                        return;
                    }
                    else
                    {
                        KillWorkbenchProcesses();
                    }
                    await Task.Delay(3000);
                }
'''
          new_running = '''                if (IsWorkbenchRunning())
                {
                    // v11 migration is intentionally non-destructive. Updating webui.zip must not
                    // terminate the already logged-in Qianniu process; the currently loaded WebView
                    // may need one local page reload to consume the new script.
                    Log.Info("检测到千牛正在运行：执行无破坏注入升级，不关闭、不Kill、不重启千牛。marker=" + injectVersionMarker);
                }
'''
          assert old_running in q
          q = q.replace(old_running, new_running)
          old_result = '''                if (success == needInjectPaths.Count)
                {
                    MessageBox.Show("千牛插件注入成功，请重新启动千牛!!");
                }
                else if (success > 0)
                {
                    MessageBox.Show("千牛插件部分注入成功，请重新启动千牛后检查连接状态。");
                }
                else
                {
                    MessageBox.Show("千牛插件注入失败!!");
                }
'''
          new_result = '''                if (success == needInjectPaths.Count)
                {
                    Log.Info("千牛注入升级已写入磁盘：无需重启千牛；当前仍运行旧脚本的WebView将在局部页面重新加载后切换到 " + injectVersionMarker);
                }
                else if (success > 0)
                {
                    Log.Error("千牛注入仅部分升级成功：保持千牛运行，不自动重启；等待后续无破坏重试。 success=" + success + ", total=" + needInjectPaths.Count);
                }
                else
                {
                    Log.Error("千牛注入升级失败：保持千牛运行，不自动重启；等待后续无破坏重试。 marker=" + injectVersionMarker);
                }
'''
          assert old_result in q
          q = q.replace(old_result, new_result)
          qn_path.write_text(q, encoding='utf-8-sig')

          test_path = Path('tests/test_1371_recoverable_inject_v11_static.py')
          test_path.write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef test_inject_v11_never_permanently_retires_webview():\n    text = (ROOT / "src/Bin/inject.js").read_text(encoding="utf-8-sig")\n    assert "20260909-ws-recoverable-standby-v11" in text\n    assert "websocketRetired" not in text\n    assert "websocketStandbyUntil" in text\n    assert "recoverableStandby: true" in text\n    assert "scheduleReconnect(15000)" in text\n\ndef test_qninject_v11_migrates_without_killing_qianniu():\n    text = (ROOT / "src/Bot/Common/QNInject.cs").read_text(encoding="utf-8-sig")\n    assert 'injectVersionMarker = "20260909-ws-recoverable-standby-v11"' in text\n    start = text.index("public static async Task StartInject()")\n    end = text.index("private static string FindInstallPath()", start)\n    body = text[start:end]\n    assert "KillWorkbenchProcesses();" not in body\n    assert "需要先退出千牛后注入插件" not in body\n    assert "不关闭、不Kill、不重启千牛" in body\n''', encoding='utf-8')
      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/patch-recoverable-inject-v11.yml
      - name: Commit patch
        run: |
          git config user.name "qnbot-ci"
          git config user.email "qnbot-ci@users.noreply.github.com"
          git add src/Bin/inject.js src/Bot/Common/QNInject.cs tests/test_1371_recoverable_inject_v11_static.py
          git commit -m "Apply recoverable inject v11 migration"
          git push origin HEAD:fix/recoverable-inject-v11-20260909
