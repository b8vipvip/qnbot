name: Temporary reply dedup brace fix

on:
  push:
    branches:
      - fix/v2-late-answer-generation-authority-20260906

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2-late-answer-generation-authority-20260906
          fetch-depth: 0
      - name: Fix syntax
        run: python .github/scripts/tmp_fix_reply_dedup_brace_20260906.py
      - name: Commit syntax fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Bot/ChromeNs/ReplyDeduplicationService.cs
          git commit -m 'fix: repair cancellation-aware dedup syntax'
          git push origin HEAD:fix/v2-late-answer-generation-authority-20260906
