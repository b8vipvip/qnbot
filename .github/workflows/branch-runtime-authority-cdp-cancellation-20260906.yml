name: Branch runtime authority CDP cancellation repair

on:
  push:
    branches:
      - fix/runtime-authority-cdp-cancellation-20260906

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-authority-cdp-cancellation-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Apply runtime repair
        run: python .github/scripts/runtime_authority_cdp_cancellation_20260906.py
      - name: Normalize generated regression test and tracker UI text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_1296_runtime_authority_cdp_cancellation_static.py')
          s = p.read_text(encoding='utf-8')
          bad = '    assert "SetSendCancellation(stage, "买家已发送更新消息，旧答案不会发送")" in rpa\n'
          good = '    assert \'SetSendCancellation(stage, "买家已发送更新消息，旧答案不会发送")\' in rpa\n'
          if bad not in s:
              raise SystemExit('generated test assertion anchor missing')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')

          tracker_path = Path('src/Bot/ChromeNs/ResponseProgressTracker.cs')
          tracker = tracker_path.read_text(encoding='utf-8-sig')
          call_marker = 'IsMandatoryOrderAnswer(seller, buyer, previous.Answer)'
          call_pos = tracker.find(call_marker)
          if call_pos < 0:
              raise SystemExit('tracker authority call missing')
          start_marker = 'previous.Control.SetStatus('
          start = tracker.rfind(start_marker, 0, call_pos)
          end_marker = 'false);'
          end = tracker.find(end_marker, call_pos)
          if start < 0 or end < 0:
              raise SystemExit('tracker UI status boundaries missing')
          end += len(end_marker)
          indent_start = tracker.rfind('\n', 0, start) + 1
          prefix = tracker[indent_start:start]
          replacement = '''previous.Control.SetStatus(
                            previous.AnswerReadyAt == DateTime.MinValue
                                ? "买家补充了新消息，上一条Bot任务继续独立处理，发送前会再次检查相关性"
                                : "买家已补充新消息，上一条答案保留；实际发送资格由业务/会话权威层决定",
                            false);'''
          tracker = tracker[:start] + replacement + tracker[end:]
          tracker_path.write_text(tracker, encoding='utf-8-sig')
          PY
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_1296_runtime_authority_cdp_cancellation_static.py tests/test_1272_knowledge_authority_and_turn_lifecycle_static.py
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Bot/ChromeNs/OrderPlacedAutoReplyService.cs src/Bot/ChromeNs/QNRpa.cs src/Bot/ChromeNs/ResponseProgressTracker.cs src/Bot/ChromeNs/MyOpenAI.cs src/Bot/ChromeNs/MyWebSocketServer.cs tests/test_1296_runtime_authority_cdp_cancellation_static.py
          git commit -m "fix: separate business send authority and bound runtime resources"
          git push origin HEAD:fix/runtime-authority-cdp-cancellation-20260906
