name: Temporary runtime authority repair

on:
  push:
    branches:
      - fix/runtime-lifecycle-identity-recovery-20260906

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-lifecycle-identity-recovery-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply structural repair
        run: python .github/scripts/runtime_authority_repair_20260906.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_1291_runtime_authority_static.py
      - name: Commit repaired production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/Bot/ChromeNs/BuyerStreamingReplyPipeline.cs \
            src/Bot/ChromeNs/BulkListManagementUiBridge.cs \
            src/Bot/Knowledge/KnowledgeCenterWindow.cs \
            tests/test_1291_runtime_authority_static.py
          if git diff --cached --quiet; then
            echo 'No production changes to commit.'
            exit 0
          fi
          git commit -m 'fix: unify runtime cancellation identity and ingress recovery'
          git push origin HEAD:fix/runtime-lifecycle-identity-recovery-20260906
