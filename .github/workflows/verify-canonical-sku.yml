name: Verify canonical SKU fix

on:
  push:
    branches:
      - fix/canonical-sku-nonblocking

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare legacy project files
        shell: pwsh
        run: |
          $projects = @(
            'src\Bot\Bot.csproj',
            'src\DbEntity\DbEntity.csproj'
          )
          foreach ($project in $projects) {
            if (-not (Test-Path -LiteralPath $project)) { continue }
            $xml = Get-Content -LiteralPath $project -Raw
            $xml = $xml -replace '\{F935DC20-1CF0-11D0-ADB9-00C04FD58A\}', '{F935DC20-1CF0-11D0-ADB9-00C04FD58A0B}'
            $xml = [regex]::Replace($xml, '(?s)\s*<Reference Include="TopSdk[^>]*>.*?</Reference>', '')
            if ($project -like '*\Bot\Bot.csproj' -and $xml -notmatch 'ICSharpCode\.SharpZipLib') {
              $sharpZipReference = '    <Reference Include="ICSharpCode.SharpZipLib"><HintPath>..\packages\SharpZipLib.1.4.2\lib\netstandard2.0\ICSharpCode.SharpZipLib.dll</HintPath><Private>True</Private></Reference>'
              $xml = $xml -replace '(\s*<Reference Include="System" />)', "`r`n$sharpZipReference`$1"
            }
            Set-Content -LiteralPath $project -Value $xml -Encoding UTF8
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src\Bot.sln -NonInteractive -Verbosity normal

      - name: Build
        shell: pwsh
        run: msbuild src\Bot.sln /m /t:Rebuild /nologo /v:minimal /p:Configuration=Debug /p:Platform=x64

      - name: Setup test runner
        run: python -m pip install pytest

      - name: Run regression tests
        run: python -m pytest tests -q --ignore=tests/test_1309_websocket_lifecycle_static.py --ignore=tests/test_1378_recoverable_qn_websocket_authority_static.py
