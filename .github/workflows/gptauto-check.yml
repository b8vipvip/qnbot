name: GPTAuto Protocol Check
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/gptauto/**'
      - '.github/tests/test_gptauto.py'
      - '.github/actions/upload-gptauto-log/**'
      - '.github/GPTAUTO.md'
      - '.github/workflows/gptauto-*.yml'
  push:
    branches: [master]
    paths:
      - '.github/gptauto/**'
      - '.github/tests/test_gptauto.py'
      - '.github/actions/upload-gptauto-log/**'
      - '.github/GPTAUTO.md'
      - '.github/workflows/gptauto-*.yml'
permissions:
  contents: read
concurrency:
  group: gptauto-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate qnbot terminal gate bindings
        shell: bash
        run: |
          set -euo pipefail
          reconcile='.github/workflows/gptauto-reconcile.yml'
          observer='.github/workflows/gptauto-observer.yml'
          executor='.github/workflows/gptauto-executor.yml'

          grep -Fq 'Windows x64 release build' "$reconcile"
          grep -Fq 'API control plane CI' "$reconcile"
          grep -Fq 'GPTAuto Protocol Check' "$reconcile"
          grep -Fq 'Publish Bot auto-update release' "$reconcile"
          grep -Fq 'recover-active-leases' "$reconcile"
          grep -Fq 'all-ci-run-ids' "$reconcile"

          grep -Fq 'Windows x64 release build' "$observer"
          grep -Fq 'API control plane CI' "$observer"
          grep -Fq 'GPTAuto Protocol Check' "$observer"
          grep -Fq 'Publish Bot auto-update release' "$observer"
          grep -Fq 'release-required-override' "$observer"

          grep -Fq 'windows-build.yml' "$executor"
          grep -Fq 'api-control-plane-ci.yml' "$executor"
          grep -Fq 'gptauto-check.yml' "$executor"
          if grep -Fq 'gh workflow run CI ' "$executor"; then
            echo 'Executor must not dispatch a nonexistent generic CI workflow in qnbot.' >&2
            exit 1
          fi
          if grep -Fq 'gh workflow run Release ' "$executor"; then
            echo 'Executor must not dispatch a nonexistent generic Release workflow in qnbot.' >&2
            exit 1
          fi
      - name: Test embedded GPTAuto
        run: PYTHONPATH=.github python -m unittest discover -s .github/tests -p 'test_gptauto.py' -v
      - name: Create diagnostic smoke task
        shell: bash
        run: |
          PYTHONPATH=.github python -m gptauto.cli init --goal "CI diagnostic smoke test" --repo "${{ github.repository }}" --out .gptauto/task.json > /tmp/gptauto-init.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path("/tmp/gptauto-init.json").read_text())
          with open(os.environ["GITHUB_ENV"],"a") as f: f.write("GPTAUTO_TASK_ID="+Path(data["directory"]).name+"\n")
          PY
      - name: Upload GPTAuto diagnostic artifact
        uses: ./.github/actions/upload-gptauto-log
        with:
          task-id: ${{ env.GPTAUTO_TASK_ID }}
          retention-days: '1'
