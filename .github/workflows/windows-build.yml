name: Windows x64 release build

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tools/qn_discovery_lab/**'
      - 'tests/**'
      - 'scripts/Invoke-QnBotAcceptanceDiagnostics.ps1'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/api-control-plane-ci.yml'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tools/qn_discovery_lab/**'
      - 'tests/**'
      - 'scripts/Invoke-QnBotAcceptanceDiagnostics.ps1'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/api-control-plane-ci.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  # Called CI and standalone PR builds must not cancel each other.
  group: windows-release-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install Python tool-test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check uiautomation pytest
      - name: Compile Python tools
        shell: pwsh
        run: |
          python -m py_compile `
            tools/qn_discovery_lab/qn_uia_extract_messages_core.py `
            tools/qn_discovery_lab/qn_uia_extract_messages.py `
            tools/qn_discovery_lab/qn_uia_message_lifecycle.py `
            tools/qn_discovery_lab/qn_uia_lifecycle_probe.py `
            tools/qn_discovery_lab/qn_uia_withdraw_exact_probe.py
      - name: Run ShopKey and conversation-learning regression tests
        shell: pwsh
        run: python -m pytest -q tests/test_session_auto_learning_static.py tests/test_session_auto_learning_full_corpus_static.py
      - name: Run generic image evidence and conditional advice regressions
        shell: pwsh
        run: python -m pytest -q tests/test_conditional_business_advice_static.py tests/test_visual_image_knowledge_library_static.py tests/test_knowledge_retrieval_quality_regressions.py
      - name: Validate read-only Windows acceptance diagnostics syntax
        shell: pwsh
        run: |
          $scriptText = Get-Content -LiteralPath 'scripts/Invoke-QnBotAcceptanceDiagnostics.ps1' -Raw
          [void][scriptblock]::Create($scriptText)
      - name: Run Windows-specific lifecycle tests
        shell: pwsh
        run: python -m unittest discover -s tools/qn_discovery_lab/tests
      - name: Validate updater with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src\Bot\Update\BotAutoUpdater.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List *; throw "BotAutoUpdater.ps1 has Windows PowerShell 5.1 parser errors." }
      - name: Run updater handoff sensor regression tests
        shell: powershell
        run: .\tests\windows\test-updater-handoff-authority.ps1
      - name: Validate read-only acceptance diagnostics with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $paths = @(
            'scripts\Invoke-QnBotAcceptanceDiagnostics.ps1',
            'scripts\Collect-QnBotMemory.ps1',
            'scripts\Compare-QnBotKnowledgeV2Devices.ps1',
            'scripts\Invoke-QnBotAutoDeliveryDiagnostics.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host ("path=$path line=$($_.Extent.StartLineNumber) column=$($_.Extent.StartColumnNumber) error=$($_.Message)") }
              throw ($path + " has Windows PowerShell 5.1 parser errors.")
            }
          }
      - name: Run Knowledge V2 two-device comparator runtime tests
        shell: powershell
        run: .\tests\windows\test-knowledge-v2-device-comparator.ps1
      - name: Run auto-delivery read-only diagnostics runtime tests
        shell: powershell
        run: .\tests\windows\test-auto-delivery-diagnostics.ps1
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore src/Bot.sln -PackagesDirectory src/packages -NonInteractive
      - name: Build Bot solution x64
        shell: pwsh
        run: |
          msbuild src/Bot.sln /t:Build /m /nologo /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /bl:msbuild.binlog '/flp:logfile=msbuild.log;verbosity=diagnostic'
          $code = $LASTEXITCODE
          if ($code -ne 0) { Select-String -Path msbuild.log -Pattern ': error ',' error CS',' error MSB' | Select-Object -Last 120 | ForEach-Object { Write-Host $_.Line }; exit $code }
      - name: Run compiled Knowledge V2 fact and scope regressions
        shell: powershell
        run: .\tests\windows\test-knowledge-v2-fact-scope.ps1
      - name: Run persisted Knowledge V2 SQLite and crash recovery regressions
        shell: powershell
        run: .\tests\windows\test-knowledge-v2-sqlite-recovery.ps1
      - name: Upload MSBuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msbuild-diagnostics-x64-${{ github.sha }}
          path: |
            msbuild.log
            msbuild.binlog
          if-no-files-found: warn
          retention-days: 14
      - name: Assemble complete runtime package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD 'package'; $packageBin = Join-Path $packageRoot 'Bin'; $packageData = Join-Path $packageRoot 'data'; $packageDiagnostics = Join-Path $packageRoot 'diagnostics'; $packageDocs = Join-Path $packageRoot 'docs'; $releaseBin = Join-Path $PWD 'src\Bot\bin\x64\Release'; $baselineBin = Join-Path $PWD 'src\Bin'; $sourceData = Join-Path $PWD 'src\data'
          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageBin -Force | Out-Null; New-Item -ItemType Directory -Path $packageData -Force | Out-Null; New-Item -ItemType Directory -Path $packageDiagnostics -Force | Out-Null; New-Item -ItemType Directory -Path $packageDocs -Force | Out-Null
          Copy-Item -Path (Join-Path $baselineBin '*') -Destination $packageBin -Recurse -Force
          Copy-Item -Path (Join-Path $releaseBin '*') -Destination $packageBin -Recurse -Force
          if (Test-Path -LiteralPath $sourceData -PathType Container) { Get-ChildItem -LiteralPath $sourceData -Force | Where-Object { $_.Name -ne 'params.db' } | Copy-Item -Destination $packageData -Recurse -Force }
          Copy-Item -LiteralPath 'scripts\Invoke-QnBotAcceptanceDiagnostics.ps1' -Destination (Join-Path $packageDiagnostics 'Invoke-QnBotAcceptanceDiagnostics.ps1') -Force
          Copy-Item -LiteralPath 'docs\CONDITIONAL_BUSINESS_ADVICE.md' -Destination (Join-Path $packageDocs 'CONDITIONAL_BUSINESS_ADVICE.md') -Force
          @('This package preserves the established Bin + data directory layout.','','params.db is intentionally excluded because it contains local user configuration and runtime state.','','OCR inference is provided by the authenticated server control plane.','No LocalOcrWorker executable or OCR model files are required on Windows.','','Back up your existing data directory before testing.','Copy only your own params.db into this package data directory.','Do not commit or upload params.db.') | Set-Content -LiteralPath (Join-Path $packageData 'README-PARAMS.txt') -Encoding UTF8
      - name: Verify complete Bot package
        shell: pwsh
        run: |
          $required = @('package\Bin\Bot.exe','package\Bin\Bot.exe.config','package\Bin\BotLib.dll','package\Bin\DbEntity.dll','package\Bin\FlaUI.Core.dll','package\Bin\FlaUI.UIA3.dll','package\data\README-PARAMS.txt','package\diagnostics\Invoke-QnBotAcceptanceDiagnostics.ps1','package\docs\CONDITIONAL_BUSINESS_ADVICE.md')
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required package file not found: $path" } }
          if (Test-Path -LiteralPath 'package\Bin\local-ocr') { throw 'Local OCR runtime must not be bundled after server OCR migration.' }
          if (Test-Path -LiteralPath 'package\data\params.db') { throw 'params.db must not be present in the GitHub artifact.' }
      - name: Upload complete x64 package
        uses: actions/upload-artifact@v7
        with:
          name: qianniu-bot-complete-x64-${{ github.sha }}
          path: package/**
          if-no-files-found: error
          retention-days: 14
