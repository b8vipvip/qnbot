name: GPTAuto Executor
on:
  workflow_dispatch:
  repository_dispatch:
    types: [gptauto_observation]
permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write
concurrency:
  group: gptauto-executor-${{ github.event.client_payload.observer_run_id || github.run_id }}
  cancel-in-progress: true
jobs:
  execute:
    # Observer explicitly schedules Executor only after actionable evidence was
    # captured. Executor no longer subscribes to Observer workflow completion,
    # eliminating GitHub-created skipped Executor runs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download observer state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OBSERVER_RUN_ID: ${{ github.event.client_payload.observer_run_id || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "$OBSERVER_RUN_ID" ]]; then
            OBSERVER_RUN_ID="$(gh api "repos/$REPOSITORY/actions/workflows/gptauto-observer.yml/runs?status=success&per_page=20" --jq '.workflow_runs[0].id // empty')"
          fi
          [[ -n "$OBSERVER_RUN_ID" ]] || { echo "::error::No successful GPTAuto Observer run found"; exit 1; }
          artifact_id="$(gh api "repos/$REPOSITORY/actions/runs/$OBSERVER_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("gptauto-GA-")) | .id' | head -n1)"
          [[ -n "$artifact_id" ]] || { echo "No GPTAuto artifact on observer run"; exit 0; }
          mkdir -p /tmp/gptauto-state
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" > /tmp/gptauto.zip
          unzip -q /tmp/gptauto.zip -d /tmp/gptauto-state
          state="$(find /tmp/gptauto-state -name state.json -type f | head -n1)"
          [[ -n "$state" ]] || { echo "::error::state.json missing from GPTAuto artifact"; exit 1; }
          action="$(PYTHONPATH=.github python -m gptauto.executor "$state")"
          echo "$action" | tee /tmp/gptauto-action.json
          echo "action=$(jq -r '.action' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "task-id=$(jq -r '.task_id' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "pr-number=$(jq -r '.pr_number // empty' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "head-sha=$(jq -r '.head_sha // empty' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "merge-sha=$(jq -r '.merge_sha // empty' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "run-id=$(jq -r '.run_id // empty' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "release-required=$(jq -r '.release_required // false' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "repair-key=$(jq -r '.repair_key // empty' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "lease-active=$(jq -r '.completion_lease.active // false' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "foreground-status=$(jq -r '.completion_lease.foreground_completion_status // "continue_required"' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "foreground-disposition=$(jq -r '.completion_lease.foreground_disposition // "CONTINUE_REQUIRED"' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "allow-foreground-exit=$(jq -r '.completion_lease.allow_foreground_exit // false' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "requires-foreground-poll=$(jq -r '.completion_lease.host_control.requires_foreground_poll // true' <<<"$action")" >> "$GITHUB_OUTPUT"
          echo "host-control=$(jq -c '.completion_lease.host_control' <<<"$action")" >> "$GITHUB_OUTPUT"
      - name: Publish canonical host control
        if: ${{ steps.state.outputs.lease-active == 'true' }}
        env:
          HOST_CONTROL: ${{ steps.state.outputs.host-control }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .gptauto/host-control
          jq -e '.schema == "gptauto.host-control/v2" and .task_alive == true' <<<"$HOST_CONTROL" > ".gptauto/host-control/$TASK_ID.json"
          echo "::notice::GPTAUTO_HOST_CONTROL task=$TASK_ID disposition=$(jq -r '.foreground_disposition' <<<"$HOST_CONTROL") next=$(jq -r '.next_host_action' <<<"$HOST_CONTROL")"
      - name: Upload canonical host control
        if: ${{ steps.state.outputs.lease-active == 'true' && hashFiles(format('.gptauto/host-control/{0}.json', steps.state.outputs.task-id)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gptauto-host-control-${{ steps.state.outputs.task-id }}
          path: .gptauto/host-control/${{ steps.state.outputs.task-id }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Execute safe merge gate
        if: ${{ steps.state.outputs.action == 'merge' }}
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.state.outputs.pr-number }}
          EXPECTED_HEAD: ${{ steps.state.outputs.head-sha }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          actual_head="$(jq -r '.head.sha' <<<"$pr")"
          [[ "$actual_head" == "$EXPECTED_HEAD" ]] || { echo "::error::PR head moved; refusing stale merge"; exit 1; }
          [[ "$(jq -r '.draft' <<<"$pr")" == "false" ]] || { echo "::error::PR is draft"; exit 1; }
          [[ "$(jq -r '.mergeable' <<<"$pr")" != "false" ]] || { echo "::error::PR is not mergeable"; exit 1; }

          runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&per_page=100")"
          latest_runs="$(jq '[.workflow_runs
            | sort_by([.workflow_id, .event, .created_at, .id])
            | group_by([.workflow_id, .event])
            | map(last)
            | .[]
            | select(.name != "GPTAuto Observer" and .name != "GPTAuto Executor")
          ]' <<<"$runs")"
          blocking_runs="$(jq '[.[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))]' <<<"$latest_runs")"
          blocking="$(jq 'length' <<<"$blocking_runs")"
          if [[ "$blocking" != "0" ]]; then
            jq -r '.[] | "::error::blocking latest workflow: \(.name) event=\(.event) run=\(.id) status=\(.status) conclusion=\(.conclusion // "null")"' <<<"$blocking_runs"
            echo "::error::$blocking latest workflow run(s) are not safely complete"
            exit 1
          fi

          gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f merge_method=squash \
            -f sha="$EXPECTED_HEAD" | tee /tmp/gptauto-merge.json
          jq -e '.merged == true' /tmp/gptauto-merge.json >/dev/null
          merge_sha="$(jq -r '.sha' /tmp/gptauto-merge.json)"
          default_branch="$(gh api "repos/$REPOSITORY" --jq '.default_branch')"
          echo "Merged as $merge_sha; ensuring post-merge workflows are running on $default_branch."

          gh workflow run gptauto-reconcile.yml --repo "$REPOSITORY" --ref "$default_branch" \
            -f task_id="$TASK_ID" -f pr_number="$PR_NUMBER" -f merge_sha="$merge_sha" \
            -f release_required="${{ steps.state.outputs.release-required }}"
      - name: Adopt externally merged completion lease
        if: ${{ steps.state.outputs.action == 'reconcile_adopt' }}
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
          PR_NUMBER: ${{ steps.state.outputs.pr-number }}
          MERGE_SHA: ${{ steps.state.outputs.merge-sha }}
          RELEASE_REQUIRED: ${{ steps.state.outputs.release-required }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$TASK_ID" && -n "$PR_NUMBER" && -n "$MERGE_SHA" ]] || {
            echo "::error::Reconcile adoption is missing task/PR/merge identity."
            exit 1
          }
          terminal_artifact="$(gh api "repos/$REPOSITORY/actions/artifacts?name=gptauto-$TASK_ID&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' 2>/dev/null || true)"
          if [[ -n "$terminal_artifact" ]]; then
            rm -rf /tmp/gptauto-adopt
            mkdir -p /tmp/gptauto-adopt
            gh api "repos/$REPOSITORY/actions/artifacts/$terminal_artifact/zip" > /tmp/gptauto-adopt.zip
            unzip -qo /tmp/gptauto-adopt.zip -d /tmp/gptauto-adopt
            if find /tmp/gptauto-adopt -name completion.json -type f -print -quit | grep -q .; then
              echo "Terminal DONE artifact already exists for $TASK_ID; no adoption dispatch needed."
              exit 0
            fi
          fi
          gh workflow run gptauto-reconcile.yml --repo "$REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f task_id="$TASK_ID" -f pr_number="$PR_NUMBER" -f merge_sha="$MERGE_SHA" \
            -f release_required="$RELEASE_REQUIRED"
          echo "Adopted merged Completion Lease for $TASK_ID / $MERGE_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Emit repair request
        if: ${{ steps.state.outputs.action == 'repair_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.state.outputs.pr-number }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
          FAILED_RUN_ID: ${{ steps.state.outputs.run-id }}
          HEAD_SHA: ${{ steps.state.outputs.head-sha }}
          REPAIR_KEY: ${{ steps.state.outputs.repair-key }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .gptauto/repair-requests
          request=".gptauto/repair-requests/$TASK_ID.json"
          jq -n --arg task "$TASK_ID" --arg run "$FAILED_RUN_ID" --arg pr "$PR_NUMBER" \
            '{kind:"repair_request",task_id:$task,run_id:$run,pr_number:$pr,status:"open",repair_owner:"repair_pipeline"}' > "$request"
          if [[ -n "$PR_NUMBER" ]]; then
            marker="<!-- gptauto-repair:$REPAIR_KEY -->"
            existing="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[].body' 2>/dev/null || true)"
            if ! grep -Fq "$marker" <<<"$existing"; then
              gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$marker
          GPTAuto three-tier repair cycle is open for task $TASK_ID on current head $HEAD_SHA (latest failed run $FAILED_RUN_ID). Tier 1 deterministic repair runs first, Tier 2 Copilot CLI runs only if Tier 1 produces no patch, and Tier 3 explicitly hands the same repair lease to the foreground host if automation cannot repair it."
            fi
          fi
      - name: Dispatch three-tier repair pipeline
        id: repair-dispatch
        if: ${{ steps.state.outputs.action == 'repair_request' }}
        env:
          GH_TOKEN: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
          PR_NUMBER: ${{ steps.state.outputs.pr-number }}
          HEAD_SHA: ${{ steps.state.outputs.head-sha }}
          FAILED_RUN_ID: ${{ steps.state.outputs.run-id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$PR_NUMBER" && -n "$HEAD_SHA" && -n "$FAILED_RUN_ID" ]] || {
            echo "::error::Repair dispatch is missing PR/head/run identity."
            exit 1
          }
          marker="<!-- gptauto-repair-dispatched:$TASK_ID:$HEAD_SHA -->"
          comments="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[].body' 2>/dev/null || true)"
          if grep -Fq "$marker" <<<"$comments"; then
            echo "Three-tier repair already dispatched for $TASK_ID / $HEAD_SHA; keeping the same repair lease."
            exit 0
          fi
          gh workflow run gptauto-repair.yml --repo "$REPOSITORY" \
            --ref "$(gh api "repos/$REPOSITORY" --jq '.default_branch')" \
            -f task_id="$TASK_ID" -f pr_number="$PR_NUMBER" \
            -f head_sha="$HEAD_SHA" -f failed_run_id="$FAILED_RUN_ID"
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body "$marker
          GPTAuto dispatched the three-tier repair pipeline for task $TASK_ID on head $HEAD_SHA. The Completion Lease remains active until the repaired head passes its gates; Tier 3 will publish FOREGROUND_RECOVERY_REQUIRED if Tier 1 and Tier 2 cannot safely produce/apply a patch."
          echo "Dispatched three-tier repair pipeline for $TASK_ID / $HEAD_SHA."
      - name: Persist completion lease
        if: ${{ steps.state.outputs.lease-active == 'true' }}
        env:
          TASK_ID: ${{ steps.state.outputs.task-id }}
          ACTION: ${{ steps.state.outputs.action }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .gptauto/completion-leases
          cp /tmp/gptauto-action.json ".gptauto/completion-leases/$TASK_ID.json"
          echo "Completion lease remains active for $TASK_ID; current decision is $ACTION." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish foreground completion guard
        if: ${{ steps.state.outputs.lease-active == 'true' && steps.state.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.state.outputs.pr-number }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
          ACTION: ${{ steps.state.outputs.action }}
        shell: bash
        run: |
          set -Eeuo pipefail
          marker="<!-- gptauto-completion-lease:$TASK_ID -->"
          body="$marker
          GPTAuto Completion Lease is ACTIVE for task $TASK_ID (decision: $ACTION).

          This engineering task is NOT complete. EXIT_GUARD=DENY while this Completion Lease is ACTIVE. A PR, commit, successful partial check, repair request, merge, release-in-progress, or merely waiting for GitHub Actions is non-terminal evidence. Before ending the engineering turn, the foreground host MUST re-read the current task guard. If allow_foreground_exit=false or terminal_done=false, it MUST remain attached, inspect the failed run, repair the same PR, push, and poll/recover asynchronous gates. Exit is permitted only after terminal DONE releases the lease, or a genuine BLOCKED condition explicitly requires user action."
          comments="$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" 2>/dev/null || echo '[]')"
          comment_id="$(jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))] | .[0].id // empty' <<<"$comments")"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
          fi
      - name: Persist timeout recovery checkpoint
        if: ${{ steps.state.outputs.action == 'timeout_recovery' }}
        env:
          TASK_ID: ${{ steps.state.outputs.task-id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ".gptauto/checkpoints"
          cp /tmp/gptauto-action.json ".gptauto/checkpoints/$TASK_ID.json"
          {
            echo "## GPTAuto timeout recovery"
            echo "- Task: $TASK_ID"
            echo "- The current foreground ChatGPT session is no longer required for task continuity."
            echo "- State is checkpointed in the Observer artifact; subsequent GitHub events reattach to the same TASK_ID."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Executor summary
        if: always()
        env:
          ACTION: ${{ steps.state.outputs.action }}
          TASK_ID: ${{ steps.state.outputs.task-id }}
        run: |
          {
            echo "## GPTAuto Executor"
            echo "- Task: $TASK_ID"
            echo "- Decision: $ACTION"
            echo "- Safe merge is executed only after all current head workflows are completed successfully/neutral/skipped."
            echo "- Failures become one repair cycle per TASK_ID + current PR head; superseded/cancelled runs do not create repair storms."
            echo "- Repair authority is one pipeline: deterministic → Copilot CLI → explicit foreground recovery; tiers never run as competing repair owners."
            echo "- A non-DONE task keeps an explicit completion lease active; foreground completion is valid only after DoD."
          } >> "$GITHUB_STEP_SUMMARY"
